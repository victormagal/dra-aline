<header class="head">
  <p class="eyebrow">Exames laboratoriais</p>
  <h1>Por trimestre</h1>
</header>

<main class="content">
  <nav class="seg">
    <a routerLink="/exames/janelas" routerLinkActive="active">Janelas de coleta</a>
    <a routerLink="/exames/resultados" routerLinkActive="active">Resultados</a>
  </nav>

  <nav class="tri" role="tablist">
    @for (t of trimestres; track t.label; let i = $index) {
      <button
        type="button"
        role="tab"
        [class.active]="selected() === i"
        [attr.aria-selected]="selected() === i"
        (click)="selected.set(i)"
      >{{ t.label }}</button>
    }
  </nav>

  <app-exam-table [rows]="atual().rows" />

  @if (atual().observacao; as obs) {
    <section class="card">
      <p class="obs">{{ obs }}</p>
    </section>
  }
</main>
